name: JetStream 3 admission

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jetstream3-admission.yml"
      - "Makefile"
      - "scripts/jetstream3_admission.js"
      - "scripts/jetstream3_javascriptcore_probe.js"
      - "scripts/jetstream3_javascriptcore_probe.json"
      - "scripts/jetstream3_measurement_profile.js"
      - "scripts/jetstream3_quickjs_probe.js"
      - "scripts/jetstream3_quickjs_probe.json"
      - "scripts/jetstream3_quickjs_shell.js"
      - "scripts/jetstream3_reference_probe_core.js"
      - "scripts/jetstream3_reference_experiment.js"
      - "scripts/jetstream3_spidermonkey_probe.js"
      - "scripts/jetstream3_spidermonkey_probe.json"
      - "scripts/jetstream3_version.txt"
      - "scripts/jetstream3_v8_probe.js"
      - "scripts/jetstream3_v8_probe.json"
      - "scripts/test_jetstream3_admission.js"
      - "scripts/test_jetstream3_javascriptcore_probe.js"
      - "scripts/test_jetstream3_quickjs_probe.js"
      - "scripts/test_jetstream3_reference_experiment.js"
      - "scripts/test_jetstream3_source.sh"
      - "scripts/test_jetstream3_spidermonkey_probe.js"
      - "scripts/test_jetstream3_v8_probe.js"
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONBIT_EXPECTED_VERSION: "moon 0.1.20260819 (fc2a4ee 2026-08-19)"
  MOONBIT_CACHE_VERSION: "0.1.20260819-fc2a4ee"

jobs:
  contract:
    name: Admission contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Run deterministic contract tests
        run: make jetstream3-admission-test jetstream3-quickjs-probe-test jetstream3-javascriptcore-probe-test jetstream3-v8-probe-test jetstream3-spidermonkey-probe-test jetstream3-reference-experiment-test

  admission:
    name: Official runner compatibility diagnostic
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Cache MoonBit toolchain
        id: toolchain-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.moon
          key: moonbit-toolchain-${{ runner.os }}-${{ env.MOONBIT_CACHE_VERSION }}

      - name: Set up MoonBit
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify MoonBit toolchain identity
        run: bash scripts/verify_moonbit_toolchain.sh

      - name: Get MoonBit version
        id: moonbit-version
        run: echo "version=$(moon version 2>&1 | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache MoonBit dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.moon/registry
            .mooncakes
          key: moon-deps-${{ runner.os }}-${{ steps.moonbit-version.outputs.version }}-${{ hashFiles('moon.mod') }}
          restore-keys: moon-deps-${{ runner.os }}-${{ steps.moonbit-version.outputs.version }}-

      - name: Update registry
        run: moon update

      - name: Run official JetStream 3 admission ladder
        run: make jetstream3-admission

      - name: Upload raw admission evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jetstream3-admission-${{ github.sha }}
          path: jetstream3-admission*.json
          if-no-files-found: error
          retention-days: 90

  quickjs-probe:
    name: QuickJS-ng compatibility probe
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate probe contract
        run: make jetstream3-quickjs-probe-test

      - name: Acquire pinned JetStream source
        run: make jetstream3-source

      - name: Acquire and probe the specified QuickJS-ng payload
        run: |
          jsvu_version="$(node -p 'require("./scripts/jetstream3_quickjs_probe.json").jsvu_version')"
          engine_version="$(node -p 'require("./scripts/jetstream3_quickjs_probe.json").engine.version')"
          jetstream_commit="$(node -p 'require("./scripts/jetstream3_quickjs_probe.json").jetstream_commit')"
          npm install --global --ignore-scripts "jsvu@$jsvu_version"
          jsvu --os=linux64 "quickjs@$engine_version"
          node scripts/jetstream3_quickjs_probe.js \
            --spec scripts/jetstream3_quickjs_probe.json \
            --jetstream ".cache/jetstream3/$jetstream_commit" \
            --engine-root "$HOME/.jsvu/engines/quickjs-$engine_version" \
            --output jetstream3-quickjs-probe.json

      - name: Upload preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jetstream3-quickjs-probe
          path: jetstream3-quickjs-probe.json
          if-no-files-found: warn
          retention-days: 90

  javascriptcore-probe:
    name: JavaScriptCore compatibility probe
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate probe contract
        run: make jetstream3-javascriptcore-probe-test

      - name: Acquire pinned JetStream source
        run: make jetstream3-source

      - name: Acquire and probe the specified JavaScriptCore payload
        run: |
          jsvu_version="$(node -p 'require("./scripts/jetstream3_javascriptcore_probe.json").jsvu_version')"
          engine_version="$(node -p 'require("./scripts/jetstream3_javascriptcore_probe.json").engine.version')"
          jetstream_commit="$(node -p 'require("./scripts/jetstream3_javascriptcore_probe.json").jetstream_commit')"
          npm install --global --ignore-scripts "jsvu@$jsvu_version"
          jsvu --os=linux64 "javascriptcore@$engine_version"
          node scripts/jetstream3_javascriptcore_probe.js \
            --spec scripts/jetstream3_javascriptcore_probe.json \
            --jetstream ".cache/jetstream3/$jetstream_commit" \
            --engine-root "$HOME/.jsvu/engines/javascriptcore-$engine_version" \
            --output jetstream3-javascriptcore-probe.json

      - name: Upload preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jetstream3-javascriptcore-probe
          path: jetstream3-javascriptcore-probe.json
          if-no-files-found: warn
          retention-days: 90

  v8-probe:
    name: V8 compatibility probe
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate probe contract
        run: make jetstream3-v8-probe-test

      - name: Acquire pinned JetStream source
        run: make jetstream3-source

      - name: Acquire and probe the specified V8 payload
        run: |
          jsvu_version="$(node -p 'require("./scripts/jetstream3_v8_probe.json").jsvu_version')"
          engine_version="$(node -p 'require("./scripts/jetstream3_v8_probe.json").engine.version')"
          jetstream_commit="$(node -p 'require("./scripts/jetstream3_v8_probe.json").jetstream_commit')"
          npm install --global --ignore-scripts "jsvu@$jsvu_version"
          jsvu --os=linux64 "v8@$engine_version"
          node scripts/jetstream3_v8_probe.js \
            --spec scripts/jetstream3_v8_probe.json \
            --jetstream ".cache/jetstream3/$jetstream_commit" \
            --engine-root "$HOME/.jsvu/engines/v8-$engine_version" \
            --output jetstream3-v8-probe.json

      - name: Upload preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jetstream3-v8-probe
          path: jetstream3-v8-probe.json
          if-no-files-found: warn
          retention-days: 90

  spidermonkey-probe:
    name: SpiderMonkey compatibility probe
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate probe contract
        run: make jetstream3-spidermonkey-probe-test

      - name: Acquire pinned JetStream source
        run: make jetstream3-source

      - name: Acquire and probe the specified SpiderMonkey payload
        run: |
          jsvu_version="$(node -p 'require("./scripts/jetstream3_spidermonkey_probe.json").jsvu_version')"
          engine_version="$(node -p 'require("./scripts/jetstream3_spidermonkey_probe.json").engine.version')"
          jetstream_commit="$(node -p 'require("./scripts/jetstream3_spidermonkey_probe.json").jetstream_commit')"
          npm install --global --ignore-scripts "jsvu@$jsvu_version"
          jsvu --os=linux64 "spidermonkey@$engine_version"
          node scripts/jetstream3_spidermonkey_probe.js \
            --spec scripts/jetstream3_spidermonkey_probe.json \
            --jetstream ".cache/jetstream3/$jetstream_commit" \
            --engine-root "$HOME/.jsvu/engines/spidermonkey-$engine_version" \
            --output jetstream3-spidermonkey-probe.json

      - name: Upload preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jetstream3-spidermonkey-probe
          path: jetstream3-spidermonkey-probe.json
          if-no-files-found: warn
          retention-days: 90

  reference-experiment:
    name: Cross-engine reference feasibility experiment
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Cache MoonBit toolchain
        id: experiment-toolchain-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.moon
          key: moonbit-toolchain-${{ runner.os }}-${{ env.MOONBIT_CACHE_VERSION }}

      - name: Set up MoonBit
        if: steps.experiment-toolchain-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify MoonBit toolchain identity
        run: bash scripts/verify_moonbit_toolchain.sh

      - name: Get MoonBit version
        id: experiment-moonbit-version
        run: echo "version=$(moon version 2>&1 | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache MoonBit dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.moon/registry
            .mooncakes
          key: moon-deps-${{ runner.os }}-${{ steps.experiment-moonbit-version.outputs.version }}-${{ hashFiles('moon.mod') }}
          restore-keys: moon-deps-${{ runner.os }}-${{ steps.experiment-moonbit-version.outputs.version }}-

      - name: Update registry
        run: moon update

      - name: Validate experiment contract
        run: make jetstream3-reference-experiment-test

      - name: Acquire pinned JetStream source
        run: make jetstream3-source

      - name: Acquire admitted reference shells
        run: |
          jsvu_version="$(node -p 'require("./scripts/jetstream3_v8_probe.json").jsvu_version')"
          npm install --global --ignore-scripts "jsvu@$jsvu_version"
          for engine in v8 javascriptcore spidermonkey; do
            version="$(node -p "require('./scripts/jetstream3_${engine}_probe.json').engine.version")"
            jsvu --os=linux64 "$engine@$version"
          done

      - name: Run two-pass upstream-default experiment
        run: make jetstream3-reference-experiment

      - name: Upload raw feasibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jetstream3-reference-experiment-${{ github.sha }}-${{ github.run_attempt }}
          path: jetstream3-reference-experiment/
          if-no-files-found: warn
          retention-days: 90
