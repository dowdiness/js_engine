name: Verify and Deploy Playground

on:
  push:
    branches: [main]
    paths:
      - "playground/**"
      - "example/**"
      - "*.mbt"
      - "**/*.mbt"
      - "moon.mod"
      - "moon.pkg"
      - "**/moon.pkg"
      - ".github/workflows/playground.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('js-engine-playground-pr-{0}', github.event.pull_request.number) || 'js-engine-gh-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MOONBIT_INSTALL_VERSION: "latest"
  MOONBIT_EXPECTED_VERSION: "moon 0.1.20260819 (fc2a4ee 2026-08-19)"
  MOONBIT_CACHE_VERSION: "0.1.20260819-fc2a4ee"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Cache MoonBit toolchain
        id: toolchain-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.moon
          key: moonbit-toolchain-${{ runner.os }}-${{ env.MOONBIT_CACHE_VERSION }}

      - name: Set up MoonBit
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify MoonBit toolchain identity
        run: bash scripts/verify_moonbit_toolchain.sh

      - name: Get MoonBit version
        id: moonbit-version
        run: echo "version=$(moon version 2>&1 | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache MoonBit dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.moon/registry
            .mooncakes
          key: moon-deps-${{ runner.os }}-${{ steps.moonbit-version.outputs.version }}-${{ hashFiles('moon.mod') }}
          restore-keys: moon-deps-${{ runner.os }}-${{ steps.moonbit-version.outputs.version }}-

      - name: Update MoonBit registry
        run: moon update

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: playground/web/package-lock.json

      - name: Install web dependencies
        working-directory: playground/web
        run: npm ci

      - name: Install Playwright browser
        working-directory: playground/web
        run: npx playwright install --with-deps chromium

      - name: Run web checks
        working-directory: playground/web
        run: npm test

      - name: Package Playground artifact
        run: tar -C playground/web/dist -czf "$RUNNER_TEMP/playground-dist.tar.gz" .

      - name: Upload Playground artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playground-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playground-dist.tar.gz

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playground-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playground/web/playwright-report
            playground/web/test-results
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download Playground artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: playground-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playground-artifact

      - name: Unpack Playground artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/playground-dist"
          tar -xzf "$RUNNER_TEMP/playground-artifact/playground-dist.tar.gz" \
            -C "$RUNNER_TEMP/playground-dist"

      - name: Publish Playground to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin gh-pages:refs/remotes/origin/gh-pages
          git switch --force-create gh-pages refs/remotes/origin/gh-pages
          rm -rf playground
          mkdir -p playground
          cp -R "$RUNNER_TEMP/playground-dist/." playground/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playground
          if git diff --cached --quiet; then
            echo "Playground is already up to date."
          else
            git commit -m "Deploy playground site"
            git push origin gh-pages
          fi
